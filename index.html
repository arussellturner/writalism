<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Writing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h1 id="brand-title" class="split-text-anim">Writalism</h1>
            <p>Sign in with Google to sync your writing securely</p>
            <button id="auth-button" class="neu-btn auth-btn">
                <svg class="google-logo" viewBox="0 0 48 48" width="24" height="24">
                  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                  <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                  <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                  <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="app" class="hidden">
        <button id="menu-toggle" class="icon-btn" aria-label="Toggle Menu">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <aside id="sidebar" class="sidebar">
            <div id="sidebar-pages" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
                <div class="sidebar-header" style="justify-content: flex-end; padding-top: calc(2rem + 4px);">
                    <div style="display: flex; gap: 0.75rem;">
                        <button id="theme-toggle-btn" class="neu-btn" style="width: 40px; height: 40px; padding: 0;" title="Toggle Theme">
                            <svg class="sun-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="19.78" x2="19.78" y2="18.36"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"/></svg>
                            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        </button>
                        <button id="new-page-btn" class="neu-btn" style="width: 40px; height: 40px; padding: 0;" title="New Page">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                </div>
                <div style="padding: 0 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                    <input type="text" id="page-search" placeholder="Search pages..." class="neu-input" style="padding: 0.6rem 1rem; font-size: 0.9rem;">
                    <select id="page-sort" class="neu-input" style="padding: 0.6rem 1rem; font-size: 0.9rem; width: 100%;">
                        <option value="edited-new">Edited (Newest)</option>
                        <option value="edited-old">Edited (Oldest)</option>
                        <option value="created-new">Created (Newest)</option>
                        <option value="created-old">Created (Oldest)</option>
                    </select>
                </div>
                <ul id="page-list" class="page-list">
                    <!-- Pages will be populated here -->
                </ul>
                <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; border-top: none; background: transparent;">
                    <button id="settings-btn" class="neu-btn" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; font-weight: 600;">Settings</button>
                    <button id="logout-btn" class="neu-btn" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; font-weight: 600;">Log out</button>
                </div>
            </div>

            <div id="sidebar-settings" class="hidden" style="display: flex; flex-direction: column; flex: 1; overflow: hidden; padding-top: calc(2rem + 48px + 1rem);">
                <div class="settings-scroll" id="settings-container">
                    <!-- Settings populated by JS -->
                </div>
            </div>
        </aside>

        <main class="main-content">
            <textarea id="page-title" class="page-title-input" placeholder="Page Title" rows="1" autocomplete="off"></textarea>
            <div id="editor" class="editor" contenteditable="true" placeholder="Start writing... Type @ for formatting"></div>
        </main>
        
        <div id="format-menu" class="format-menu hidden">
            <!-- Format options populated by JS -->
        </div>
    </div>

    <!-- Modals -->
    <div id="delete-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Are you sure?</h3>
            <p>This page will be permanently deleted.</p>
            <div class="modal-actions">
                <button id="cancel-delete-btn" class="btn secondary">No, cancel</button>
                <button id="confirm-delete-btn" class="btn danger">Yes, delete</button>
            </div>
        </div>
    </div>



    <script src="app.js"></script>
</body>
</html>
